<!DOCTYPE html>
<html lang="en-us">
  {{ partial "head.html" . }}
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="/" title="Home"><img src="/public/blog-logo.png" alt="{{ site.Title }}" width="523" height="187"></a>
        <nav class="site-nav" aria-label="Site">
          {{ $here := .RelPermalink }}
          {{ range slice (slice "/" "Home") (slice "/archive/" "Archive") (slice "/tags/" "Tags") (slice "/search/" "Search") (slice "/about/" "About") }}
          <a href="{{ index . 0 }}"{{ if eq $here (index . 0) }} aria-current="page"{{ end }}>{{ index . 1 }}</a>
          {{ end }}
          <a href="/atom.xml">RSS</a>
        </nav>
      </div>
    </header>
    <main class="wrap">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <div class="wrap">{{ site.Params.description }} &middot; <a href="/atom.xml">RSS</a></div>
    </footer>
  </body>
</html>
